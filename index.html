<style>
  /* Memastikan kontainer utama relatif */
  .image-wrapper {
    position: relative !important;
  }
  
  /* 1. INI ADALAH KEPALA BINTANG (Core Glow) */
  .image-wrapper::after {
    content: "" !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    border-radius: 20px !important; /* Menyesuaikan lengkungan foto */
    
    /* Gradien cahaya: Putih terang di pusat, menyebar ke biru/cyan layaknya bintang sci-fi */
    background: radial-gradient(
      circle at var(--x, 50%) var(--y, 50%), 
      rgba(255, 255, 255, 0.95) 0%, 
      rgba(0, 210, 255, 0.4) 15%, 
      transparent 180px
    ) !important;
    
    opacity: 0 !important;
    transition: opacity 0.3s ease !important;
    pointer-events: none !important; 
    z-index: 10 !important;
    mix-blend-mode: screen; /* Membuat cahayanya menyatu sangat halus dengan foto */
  }

  .image-wrapper:hover::after {
    opacity: 1 !important; 
  }
  
  /* Pastikan kartu (Prescription, Drug) tetap di lapisan paling atas tanpa terhalang */
  .floating-elements {
    z-index: 20 !important;
  }


  /* 2. INI ADALAH EKOR BINTANG JATUH (Partikel Debu Cahaya) */
  .star-particle {
    position: absolute;
    pointer-events: none; /* Agar tidak menghalangi klik/hover */
    width: 6px;
    height: 6px;
    background-color: #ffffff;
    box-shadow: 0 0 10px 2px #ffffff, 0 0 20px 5px #00d2ff; /* Efek neon/glow biru */
    border-radius: 50%;
    z-index: 9; /* Di bawah lapisan cahaya utama, tapi di atas foto */
    transform: translate(-50%, -50%);
    animation: fadeAndFall 0.7s ease-out forwards;
  }

  @keyframes fadeAndFall {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    100% {
      opacity: 0;
      /* Partikel akan menyebar secara acak dan mengecil seperti memudar */
      transform: translate(calc(-50% + var(--scatter-x)), calc(-50% + var(--scatter-y))) scale(0.1);
    }
  }
  /* Sembunyikan tombol musik atas permintaan pengguna */
  .audio-control, #music-toggle { display: none !important; }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const wrappers = document.querySelectorAll('.image-wrapper');
    const audio = document.getElementById('bg-audio');

    if (audio) {
      audio.volume = 0.35;
      audio.play().catch(function(error) {
        console.warn('Audio autoplay was blocked:', error);
        // Fallback: attempt to play once on the first user interaction
        const tryPlay = function() {
          audio.play().catch(function(){});
          window.removeEventListener('click', tryPlay);
          window.removeEventListener('touchstart', tryPlay);
        };
        window.addEventListener('click', tryPlay, { once: true });
        window.addEventListener('touchstart', tryPlay, { once: true });
      });
    }
    
    wrappers.forEach(function(wrapper) {
      let lastTime = 0; // Timer pengatur keluarnya partikel
      
      wrapper.addEventListener('mousemove', function(e) {
        const rect = wrapper.getBoundingClientRect();
        
        // Kalkulasi posisi koordinat X dan Y kursor
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // A. Menggerakkan "Kepala Bintang" (Sorotan Cahaya Utama)
        wrapper.style.setProperty('--x', x + 'px');
        wrapper.style.setProperty('--y', y + 'px');
        
        // B. Menciptakan "Ekor Bintang" (Partikel) saat kursor bergerak
        const now = Date.now();
        if (now - lastTime > 25) { // Keluarkan partikel setiap 25 milidetik agar terlihat seperti aliran
            createStarParticle(wrapper, x, y);
            lastTime = now;
        }
      });
    });

    // Fungsi Pembentuk Partikel Cahaya
    function createStarParticle(wrapper, x, y) {
      const star = document.createElement('div');
      star.className = 'star-particle';
      
      // Letakkan partikel tepat di posisi kursor
      star.style.left = x + 'px';
      star.style.top = y + 'px';
      
      // Efek sebaran (scatter) agar partikel terlihat terbang memudar secara natural
      const scatterX = (Math.random() - 0.5) * 80; // Menyebar acak ke kiri/kanan
      const scatterY = (Math.random() - 0.2) * 80; // Cenderung berjatuhan perlahan ke bawah
      
      star.style.setProperty('--scatter-x', scatterX + 'px');
      star.style.setProperty('--scatter-y', scatterY + 'px');
      
      wrapper.appendChild(star);
      
      // Hapus partikel dari sistem setelah animasinya selesai (700ms) agar memori website tidak berat
      setTimeout(() => {
        if (wrapper.contains(star)) {
          star.remove();
        }
      }, 700);
    }
  });
</script>
